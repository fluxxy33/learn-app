<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f62d9">
<title>StudyDesk</title>
<style>
:root{
  --bg:#f3f5f9; --surface:#ffffff; --surface2:#eef1f6; --line:#dfe3ea; --fg:#1b2230; --muted:#5f6878;
  --accent:#2f62d9; --accent-fg:#ffffff; --accent-soft:#e6edfc;
  --good:#1f8a52; --good-soft:#e3f4ea; --bad:#c43c3c; --bad-soft:#fbe7e7; --warn:#b8741a; --easy:#2f62d9;
  --radius:14px; --shadow:0 1px 2px rgba(20,30,50,.06),0 4px 16px rgba(20,30,50,.06);
  --font:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#12151b; --surface:#1b2029; --surface2:#232a35; --line:#2e3644; --fg:#e8ecf3; --muted:#9aa4b5;
  --accent:#7ea2ff; --accent-fg:#0c1226; --accent-soft:#1f2b48;
  --good:#4cc48a; --good-soft:#163527; --bad:#ff7b7b; --bad-soft:#3a1d1f; --warn:#f0b25a; --easy:#7ea2ff;
  --shadow:none; color-scheme:dark;
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{font:inherit;color:inherit}
#app{min-height:100%;display:flex;flex-direction:column;max-width:720px;margin:0 auto}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px}
header.top h1{font-size:1.25rem;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none}
.iconbtn:active{background:var(--surface2)}
.iconbtn svg{width:22px;height:22px}
main{flex:1;padding:4px max(16px,env(safe-area-inset-right,0px)) 96px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .inner{display:flex;width:100%;max-width:720px}
nav.tabs button{flex:1;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.75rem;color:var(--muted)}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--accent);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:16px}
.hero{background:var(--accent);color:var(--accent-fg);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:12px}
.hero .big{font-size:2.4rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.hero p{margin:0;opacity:.9}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;font-weight:600;background:var(--surface2);color:var(--fg)}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.hero .btn.primary{background:var(--accent-fg);color:var(--accent)}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.btn:active{transform:scale(.98)}
.section-title{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:8px 2px 0;font-weight:600}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--line);text-align:left;width:100%}
.row:first-child{border-top:0}
.row:active{background:var(--surface2)}
.row .dot{width:12px;height:12px;border-radius:4px;flex:none}
.row .txt{flex:1;min-width:0}
.row .txt b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .txt small{color:var(--muted)}
.pill{font-size:.78rem;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.muted{background:var(--surface2);color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:32px 16px}
.status{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}
.status i.off{background:var(--warn)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{white-space:nowrap;padding:7px 13px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:.88rem}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
/* Révision */
.progress{height:6px;background:var(--surface2);border-radius:4px;overflow:hidden}
.progress b{display:block;height:100%;background:var(--accent);transition:width .25s}
.flash{min-height:46vh;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:22px;text-align:center;font-size:1.25rem}
.flash .face{white-space:pre-wrap;overflow-wrap:anywhere}
.flash hr{border:0;border-top:1px dashed var(--line);width:100%;margin:4px 0}
.flash .back{color:var(--fg)}
.flash .label{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.flash img,.qimg{max-width:100%;max-height:34vh;object-fit:contain;border-radius:10px;align-self:center}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grades button{border-radius:12px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600;font-size:.9rem;background:var(--surface);border:1px solid var(--line)}
.grades button small{font-weight:400;color:var(--muted);font-size:.75rem}
.grades .again{color:var(--bad)} .grades .hard{color:var(--warn)} .grades .good{color:var(--good)} .grades .easy{color:var(--easy)}
.stickybottom{position:sticky;bottom:calc(74px + env(safe-area-inset-bottom,0px));padding-top:8px;background:linear-gradient(transparent,var(--bg) 30%)}
/* Quiz */
.prompt{font-size:1.15rem;font-weight:600;white-space:pre-wrap}
.choice{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line)}
.choice .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);flex:none;display:grid;place-items:center}
.choice.radio .box{border-radius:50%}
.choice.sel{border-color:var(--accent)}
.choice.sel .box{background:var(--accent);border-color:var(--accent)}
.choice.ok{border-color:var(--good);background:var(--good-soft)}
.choice.ko{border-color:var(--bad);background:var(--bad-soft)}
.answers{display:flex;flex-direction:column;gap:10px}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:1rem}
.field:focus{outline:none;border-color:var(--accent)}
.field.ok{border-color:var(--good);background:var(--good-soft)} .field.ko{border-color:var(--bad);background:var(--bad-soft)}
.cloze{line-height:2.3;font-size:1.05rem}
.cloze input{width:9em;max-width:60vw;padding:4px 8px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface)}
.cloze input.ok{border-color:var(--good);background:var(--good-soft)} .cloze input.ko{border-color:var(--bad);background:var(--bad-soft)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:stretch}
.match button{padding:12px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);text-align:left;min-height:52px}
.match button.sel{border-color:var(--accent);background:var(--accent-soft)}
.match button.paired{opacity:.9}
.match button.ok{border-color:var(--good);background:var(--good-soft)} .match button.ko{border-color:var(--bad);background:var(--bad-soft)}
.match .tag{display:inline-block;min-width:22px;padding:0 6px;margin-right:6px;border-radius:6px;background:var(--accent);color:var(--accent-fg);font-size:.8rem;text-align:center}
.feedback{border-radius:12px;padding:12px 14px}
.feedback.ok{background:var(--good-soft);color:var(--good)}
.feedback.ko{background:var(--bad-soft);color:var(--bad)}
.feedback p{margin:4px 0 0;color:var(--fg)}
.orow{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line)}
.orow .onum{font-weight:700;color:var(--accent);min-width:24px}
.orow .otxt{flex:1}
.orow.ok{border-color:var(--good);background:var(--good-soft)} .orow.ko{border-color:var(--bad);background:var(--bad-soft)}
.iconbtn:disabled{opacity:.3}
.wbuilt{min-height:56px;display:flex;flex-wrap:wrap;gap:6px;padding:10px;border-radius:12px;border:1.5px dashed var(--line)}
.wbuilt.ok{border-color:var(--good);border-style:solid} .wbuilt.ko{border-color:var(--bad);border-style:solid}
.wpool{display:flex;flex-wrap:wrap;gap:6px}
select.field{appearance:auto}
select.field.ok{border-color:var(--good);background:var(--good-soft)} select.field.ko{border-color:var(--bad);background:var(--bad-soft)}
.field:disabled{opacity:1}
.score{font-size:3rem;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
/* Lecture */
article.doc{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;overflow-wrap:anywhere}
article.doc img{max-width:100%;height:auto;border-radius:8px}
article.doc table{border-collapse:collapse;width:100%;display:block;overflow-x:auto}
article.doc td,article.doc th{border:1px solid var(--line);padding:6px 8px}
article.doc h1{font-size:1.5rem} article.doc h2{font-size:1.25rem} article.doc h3{font-size:1.08rem}
article.doc .box{background:var(--accent-soft);border-left:4px solid var(--accent);padding:10px 14px;border-radius:8px;margin:10px 0}
article.doc .slide{border-radius:12px;padding:18px;margin:0 0 14px;position:relative}
article.doc .slide h2{margin:0 0 8px}
article.doc .slide-num{position:absolute;top:8px;right:12px;font-size:.75rem;opacity:.7}
article.doc .slide details{margin-top:8px;background:rgba(0,0,0,.18);border-radius:8px;padding:6px 10px}
article.doc .caption{font-size:.8rem;opacity:.8}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;z-index:20;max-width:90vw;text-align:center}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{padding:14px}
.stat b{display:block;font-size:1.6rem;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="top"><button class="iconbtn" id="backBtn" hidden aria-label="Retour"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button><h1 id="title">StudyDesk</h1><button class="iconbtn" id="syncBtn" aria-label="Synchroniser"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-15.4 6.4L3 16"/><path d="M3 12a9 9 0 0 1 15.4-6.4L21 8"/><path d="M21 3v5h-5"/><path d="M3 21v-5h5"/></svg></button></header>
  <main id="view"></main>
  <nav class="tabs"><div class="inner">
    <button data-tab="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Accueil</button>
    <button data-tab="review"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/></svg>Fiches</button>
    <button data-tab="quiz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14"/><path d="M12 17.5h.01"/></svg>Quiz</button>
    <button data-tab="docs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h9l5 5v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M14 3v5h5"/><path d="M8 13h8M8 17h6"/></svg>Cours</button>
  </div></nav>
</div>
<script>
/*__BOOT__*/
(function(){
"use strict";
var BOOT = window.SD_BOOT || {mode:"live", token:new URLSearchParams(location.search).get("t")||""};
var LS = {
  get:function(k,d){try{var v=localStorage.getItem("sd:"+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
  set:function(k,v){try{localStorage.setItem("sd:"+k,JSON.stringify(v));}catch(e){}}
};
var DATA = null;            // données reçues du PC
var pending = LS.get("pending",{reviews:[],quizResults:[]});
var online = false;
var tab = "home";
var stack = [];             // navigation (écrans empilés)

// ------------------------------------------------------------ Utilitaires
function el(tag, attrs, children){
  var e = document.createElement(tag);
  if(attrs) for(var k in attrs){
    var v = attrs[k];
    if(v==null || v===false) continue;
    if(k==="class") e.className=v;
    else if(k==="text") e.textContent=v;
    else if(k==="html") e.innerHTML=v;
    else if(k.slice(0,2)==="on") e.addEventListener(k.slice(2),v);
    else if(k==="style") e.style.cssText=v;
    else e.setAttribute(k,v===true?"":v);
  }
  (children||[]).forEach(function(c){ if(c==null) return; e.appendChild(typeof c==="string"?document.createTextNode(c):c); });
  return e;
}
function $(id){return document.getElementById(id);}
function toast(msg){
  var t = el("div",{class:"toast",text:msg,role:"status"});
  document.body.appendChild(t);
  setTimeout(function(){t.remove();},2600);
}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x;}return a;}
function serverBase(){ return BOOT.mode==="offline" ? (BOOT.server||"") : ""; }
function api(path){ return serverBase()+path+(path.indexOf("?")>=0?"&":"?")+"t="+encodeURIComponent(BOOT.token||""); }
function mediaUrl(name){
  if(!name) return null;
  if(BOOT.mode==="offline") return (BOOT.media||{})[name]||null;
  return api("/media/"+encodeURIComponent(name));
}
function todayKey(){var d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
function endOfToday(){var d=new Date();d.setHours(23,59,59,999);return d;}
function subjectOf(id){return (DATA.subjects||[]).find(function(s){return s.id===id;})||{name:"",color:"#888"};}
function normalize(s){
  if(!s) return "";
  s = s.trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/’/g,"'").replace(/œ/g,"o").replace(/\s+/g," ");
  return s.replace(/^[ .,;!?"«»]+|[ .,;!?"«»]+$/g,"");
}
function lev(a,b){
  var d=[];for(var i=0;i<=a.length;i++){d[i]=[i];}
  for(var j=0;j<=b.length;j++) d[0][j]=j;
  for(i=1;i<=a.length;i++)for(j=1;j<=b.length;j++)
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[a.length][b.length];
}
function textMatches(given, expected){
  var g=normalize(given), e=normalize(expected);
  if(!g) return false;
  if(g===e) return true;
  if(/\d/.test(e)) return false;
  var tol = e.length>=10?2:e.length>=5?1:0;
  return lev(g,e)<=tol;
}

// ------------------------------------------------------------ Répétition espacée (identique à Srs.cs)
var GRADES = ["again","hard","good","easy"];
function srsPreview(c, g){
  var ease=c.ease, interval=c.interval, reps=c.reps, lapses=c.lapses;
  if(g===0){ if(reps>0) lapses++; reps=0; ease=Math.max(1.3,ease-0.2); return {interval:0,ease:ease,reps:reps,lapses:lapses}; }
  if(reps===0){ interval = g===3?4:1; }
  else if(reps===1){ interval = g===1?2:g===2?3:6; }
  else { var b=Math.max(1,interval); interval = g===1?b*1.2:g===2?b*ease:b*ease*1.3; }
  if(g===1) ease=Math.max(1.3,ease-0.15);
  if(g===3) ease+=0.15;
  reps++;
  interval=Math.min(Math.round(interval*10)/10,3650);
  return {interval:interval,ease:ease,reps:reps,lapses:lapses};
}
function srsApply(c, g, now){
  var r=srsPreview(c,g);
  c.interval=r.interval;c.ease=r.ease;c.reps=r.reps;c.lapses=r.lapses;c.lastReview=now.toISOString();
  var due;
  if(r.interval<=0) due=new Date(now.getTime()+60000);
  else { due=new Date(now); due.setHours(4,0,0,0); due.setDate(due.getDate()+Math.round(r.interval)); }
  c.due=due.toISOString();
}
function describe(days){
  if(days<=0) return "< 10 min";
  if(days<30) return Math.round(days)+" j";
  if(days<365) return Math.round(days/30)+" mois";
  return (Math.round(days/36.5)/10).toString().replace(".",",")+" an";
}
function isNew(c){return !c.lastReview;}
function isDue(c){return !isNew(c) && c.due && new Date(c.due)<=endOfToday();}
function newLeftToday(){
  var local = LS.get("new:"+todayKey(),0);
  return Math.max(0,(DATA.newCardsPerDay||20)-(DATA.newStudiedToday||0)-local);
}
// Réapplique localement les révisions non encore envoyées au PC
function applyPending(){
  var cards={};
  (DATA.decks||[]).forEach(function(d){d.cards.forEach(function(c){cards[c.id]=c;});});
  pending.reviews.slice().sort(function(a,b){return a.time<b.time?-1:1;}).forEach(function(r){
    var c=cards[r.cardId];
    if(c && (!c.lastReview || new Date(c.lastReview)<new Date(r.time))) srsApply(c,GRADES.indexOf(r.grade),new Date(r.time));
  });
}
function savePending(){ LS.set("pending",pending); updateSyncIndicator(); }
function pendingCount(){ return pending.reviews.length+pending.quizResults.length; }

// ------------------------------------------------------------ Données et synchronisation
function setData(d){
  DATA=d;
  LS.set("data",d);
  applyPending();
}
function loadData(){
  if(BOOT.mode==="offline"){
    var cached = LS.get("data",null);
    // Les données du fichier sont la base ; si une synchro plus récente est en cache, on la prend
    var base = BOOT.data;
    if(cached && cached.generatedAt && base && new Date(cached.generatedAt)>new Date(base.generatedAt)) base=cached;
    setData(base);
    return Promise.resolve();
  }
  return fetch(api("/api/data")).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(d){ online=true; setData(d); })
    .catch(function(){ online=false; var c=LS.get("data",null); if(c){ setData(c); toast("PC injoignable : données enregistrées sur le téléphone."); } else throw new Error("nodata"); });
}
var syncing=false;
function sync(silent){
  if(syncing) return Promise.resolve();
  if(BOOT.mode==="offline" && !BOOT.server){ if(!silent) toast("Pas d'adresse de PC pour synchroniser."); return Promise.resolve(); }
  syncing=true;
  var body = JSON.stringify(pending);
  var sent = {r:pending.reviews.length,q:pending.quizResults.length};
  return fetch(api("/api/sync"),{method:"POST",headers:{"Content-Type":"application/json"},body:body})
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(res){
      online=true;
      pending.reviews.splice(0,sent.r);
      pending.quizResults.splice(0,sent.q);
      LS.set("new:"+todayKey(),0);
      savePending();
      setData(res.data);
      if(!silent) toast(sent.r+sent.q>0 ? "Synchronisé : "+res.reviews+" révision(s), "+res.quizzes+" quiz envoyés au PC." : "À jour avec le PC.");
      if(!silent || stack.length===0) render();
    })
    .catch(function(){
      online=false; updateSyncIndicator();
      if(!silent) toast(BOOT.mode==="offline" ? "PC introuvable. Connecte-toi au même Wi-Fi et ouvre la page Téléphone sur le PC." : "Connexion au PC perdue. Tes révisions sont gardées sur le téléphone.");
    })
    .then(function(){syncing=false;});
}
var syncTimer=null;
function scheduleSync(){ if(BOOT.mode!=="live") return; clearTimeout(syncTimer); syncTimer=setTimeout(function(){sync(true);},1500); }
function updateSyncIndicator(){
  var s=$("syncStatus"); if(!s) return;
  s.innerHTML="";

function startReview(deckId){

  actions.appendChild(checkBtn);
  var grader;

  if(qq.type==="MultipleChoice"){
    var multi=qq.choices.filter(function(c){return c.correct;}).length>1;
    if(multi) answerArea.appendChild(el("div",{class:"muted",style:"font-size:.85rem",text:"Plusieurs réponses possibles."}));

      var score;
      if(correct.length===1) score = sel.length===1 && sel[0]===correct[0] ? 1:0;

      btns.forEach(function(b){ b.el.dataset.locked="1"; if(b.c.correct) b.el.classList.add("ok"); else if(sel.indexOf(b.i)>=0) b.el.classList.add("ko"); });

      var sel=el("select",{class:"field"},[el("option",{value:"",text:"— choisir —"})].concat(qq.categories.map(function(c){return el("option",{value:c,text:c});})));
      selects.push({sel:sel,i:x.i});
      answerArea.appendChild(el("div",{class:"stack",style:"gap:4px"},[el("b",{text:x.p.left}),sel]));
    });
    grader=function(){
      var ok=0;
      selects.forEach(function(x){
        var good=x.sel.value && normalize(x.sel.value)===normalize(qq.pairs[x.i].right);
        if(good) ok++;
        x.sel.disabled=true; x.sel.classList.add(good?"ok":"ko");
      });
      return ok/qq.pairs.length;
    };
  } else if(qq.type==="Numeric"){
    var nbox=el("input",{class:"field",type:"text",inputmode:"decimal",placeholder:"Ta réponse",autocomplete:"off",style:"max-width:220px"});
    nbox.addEventListener("keydown",function(e){ if(e.key==="Enter") checkBtn.click(); });
    answerArea.appendChild(el("div",{style:"display:flex;align-items:center;gap:10px"},[nbox, qq.unit?el("b",{text:qq.unit}):null]));
    setTimeout(function(){nbox.focus();},50);
    grader=function(){
      var t=(nbox.value||"").replace(/\s|\u00a0/g,"").replace(",",".").replace(/[^\d.\-eE+]+$/,"");
      var v=parseFloat(t), tol=Math.max(Math.abs(qq.tolerance||0),1e-9);
      var good=!isNaN(v) && Math.abs(v-qq.numericAnswer)<=tol;
      nbox.disabled=true; nbox.classList.add(good?"ok":"ko");
      return good?1:0;
    };
  } else if(qq.type==="WordOrder"){
    var pool=shuffle(qq.words.map(function(w,i){return {w:w,i:i};}));
    if(pool.map(function(x){return x.w;}).join(" ")===qq.words.join(" ") && pool.length>1){ var t1=pool[0]; pool[0]=pool[1]; pool[1]=t1; }
    var chosen=[], wlocked=false;
    var built=el("div",{class:"wbuilt"}), wpool=el("div",{class:"wpool"});
    answerArea.appendChild(built); answerArea.appendChild(wpool);
    function fillWords(){
      built.innerHTML=""; wpool.innerHTML="";
      if(!chosen.length) built.appendChild(el("span",{class:"muted",text:"Touche les mots dans le bon ordre."}));
      chosen.forEach(function(x){ built.appendChild(el("button",{class:"chip on",disabled:wlocked,text:x.w,onclick:function(){ chosen.splice(chosen.indexOf(x),1); pool.push(x); fillWords(); }})); });
      pool.forEach(function(x){ wpool.appendChild(el("button",{class:"chip",disabled:wlocked,text:x.w,onclick:function(){ pool.splice(pool.indexOf(x),1); chosen.push(x); fillWords(); }})); });
    }
    fillWords();
    grader=function(){
      wlocked=true; fillWords();
      var ok=0; qq.words.forEach(function(w,i){ if(chosen[i] && normalize(chosen[i].w)===normalize(w)) ok++; });
      var s=(ok===qq.words.length && chosen.length===qq.words.length)?1:ok/qq.words.length/2;
      built.classList.add(s>=0.999?"ok":"ko");
      return s;
    };
  }

  // Chrono
  var timer=null, left=q.secondsPerQuestion||0;
  function tick(){ clock.textContent="⏱ "+Math.floor(left/60)+":"+("0"+(left%60)).slice(-2); clock.style.color=left<=5?"var(--bad)":""; }
  if(left>0){ tick(); timer=setInterval(function(){ left--; tick(); if(left<=0){ clearInterval(timer); timer=null; checkBtn.click(); } },1000); window.__sdTimer=timer; }

  checkBtn.onclick=function(){
    if(timer){ clearInterval(timer); timer=null; }
    if(checkBtn.dataset.done) return;
    checkBtn.dataset.done="1";
    var s=grader();
    st.score+=s;
    var ok=s>=0.999;
    st.answers.push({q:qq,s:s});
    if(!ok) st.mistakes.push(qq);
    if(q.examMode){ st.index++; render(); window.scrollTo(0,0); return; }
    var fbx=el("div",{class:"feedback "+(ok?"ok":"ko")},[el("b",{text: left===0&&q.secondsPerQuestion&&!ok?"Temps écoulé !":ok?"Bonne réponse !":(s>0?"Presque : "+Math.round(s*100)+" % des points":"Mauvaise réponse")})]);
    if(!ok && qq.type!=="MultipleChoice" && qq.type!=="TrueFalse")
      fbx.appendChild(el("p",{text:"Réponse : "+(qq.answerText||"")}));
    if(qq.explanation) fbx.appendChild(el("p",{text:qq.explanation}));
    feedback.appendChild(fbx);
    actions.innerHTML="";
    actions.appendChild(el("button",{class:"btn primary block",text: st.index+1<st.questions.length?"Question suivante":"Voir le résultat",onclick:function(){ st.index++; render(); window.scrollTo(0,0); }}));
  };
}
function quizResults(v,st){
  var max=st.questions.length, pct=Math.round(st.score*100/max);
  if(!st.saved){
    st.saved=true;
    pending.quizResults.push({quizId:st.quiz.id,time:new Date().toISOString(),score:Math.round(st.score*100)/100,max:max});
    savePending();
    var best=LS.get("quizBest",{}); if(best[st.quiz.id]==null||best[st.quiz.id]<pct){best[st.quiz.id]=pct;LS.set("quizBest",best);}
    scheduleSync();
  }
  v.appendChild(el("div",{class:"card pad stack",style:"text-align:center"},[
    el("div",{class:"score",text:pct+" %"}),
    el("div",{class:"muted",text:(Math.round(st.score*10)/10).toString().replace(".",",")+" point(s) sur "+max}),
    el("b",{text: pct>=80?"Excellent travail !":pct>=50?"C'est bien, continue comme ça.":"Revois tes fiches et réessaie."})
  ]));
  var shown = st.quiz.examMode ? st.answers : st.mistakes.map(function(q){return {q:q,s:0};});
  if(shown.length){
    v.appendChild(el("div",{class:"section-title",text:st.quiz.examMode?"Correction":"À retravailler"}));
    var list=el("div",{class:"card list"});
    shown.forEach(function(a){
      var q=a.q;
      list.appendChild(el("div",{class:"row"},[
        st.quiz.examMode?el("span",{class:"pill "+(a.s>=0.999?"":"muted"),text:a.s>=0.999?"✓":"✗"}):null,
        el("span",{class:"txt"},[el("b",{style:"white-space:normal",text:q.prompt||"Texte à trous"}),el("small",{style:"white-space:normal;display:block",text:q.answerText||""})])]));
    });
    v.appendChild(list);
  }
  v.appendChild(el("div",{class:"grid2"},[
    el("button",{class:"btn",text:"Recommencer",onclick:function(){ stack.pop(); startQuiz(st.quiz); }}),
    el("button",{class:"btn primary",text:"Terminer",onclick:function(){ stack=[]; render(); }})
  ]));
}

// ------------------------------------------------------------ Cours
var docFilter=null;
function docList(docs){
  var list=el("div",{class:"card list"});
  docs.forEach(function(d){
    var s=subjectOf(d.subjectId);
    list.appendChild(el("button",{class:"row",onclick:function(){ push(function(v){ docView(v,d); }); }},[
      el("span",{class:"dot",style:"background:"+s.color}),
      el("span",{class:"txt"},[el("b",{text:d.title}),el("small",{text:(d.kind==="slideshow"?"Diaporama":"Document")+" · "+s.name})])
    ]));
  });
  if(!docs.length) list.appendChild(el("div",{class:"empty",text:"Aucun cours. Les documents enregistrés sur le PC apparaissent ici."}));
  return list;
}
function docsTab(v){
  setTitle("Cours");
  v.appendChild(el("div",{class:"status",id:"syncStatus"}));
  var chips=el("div",{class:"chips"});
  chips.appendChild(el("button",{class:"chip"+(docFilter?"":" on"),text:"Tous",onclick:function(){docFilter=null;render();}}));
  (DATA.subjects||[]).forEach(function(s){
    if(!(DATA.docs||[]).some(function(d){return d.subjectId===s.id;})) return;
    chips.appendChild(el("button",{class:"chip"+(docFilter===s.id?" on":""),text:s.name,onclick:function(){docFilter=s.id;render();}}));
  });
  v.appendChild(chips);
  v.appendChild(docList((DATA.docs||[]).filter(function(d){return !docFilter||d.subjectId===docFilter;})));
}
function sanitize(html){
  var tpl=document.createElement("template");
  tpl.innerHTML=html;
  tpl.content.querySelectorAll("script,iframe,object,embed,link,meta,style").forEach(function(n){n.remove();});
  tpl.content.querySelectorAll("*").forEach(function(n){
    Array.prototype.slice.call(n.attributes).forEach(function(a){ if(/^on/i.test(a.name) || (a.name==="href" && /^\s*javascript:/i.test(a.value))) n.removeAttribute(a.name); });
    if(n.tagName==="IMG"){ var src=n.getAttribute("src")||""; if(src.indexOf("sdmedia:")===0){ var u=mediaUrl(src.slice(8)); if(u) n.setAttribute("src",u); else n.remove(); } }
  });
  return tpl.content;
}
function docView(v,d){
  setTitle(d.title);
  var art=el("article",{class:"doc"},[el("div",{class:"muted",text:"Chargement…"})]);
  v.appendChild(art);
  var cacheKey="doc:"+d.id+":"+d.modifiedAt;
  function show(html){ art.innerHTML=""; art.appendChild(sanitize(html)); }
  if(BOOT.mode==="offline"){ var h=(BOOT.docs||{})[d.id]; if(h) show(h); else art.textContent="Ce cours n'est pas inclus dans le fichier hors ligne."; return; }
  var cached=LS.get(cacheKey,null);
  fetch(api("/api/doc/"+d.id)).then(function(r){ if(!r.ok) throw 0; return r.text(); })
    .then(function(h){ show(h); try{ if(h.length<1500000) LS.set(cacheKey,h); }catch(e){} })
    .catch(function(){ if(cached) show(cached); else art.textContent="Impossible de charger ce cours : le PC n'est pas joignable."; });
}

var TABS={home:homeView,review:reviewTab,quiz:quizTab,docs:docsTab};

// ------------------------------------------------------------ Démarrage
loadData().then(function(){
  render();
  if(BOOT.mode==="offline" && pendingCount()>0) sync(true);
  if(BOOT.mode==="live" && pendingCount()>0) sync(true);
}).catch(function(){
  $("view").appendChild(el("div",{class:"card pad stack"},[
    el("b",{text:"Impossible de joindre le PC"}),
    el("div",{class:"muted",text:"Vérifie que le téléphone est sur le même Wi-Fi que le PC, que la page Téléphone est ouverte dans StudyDesk, puis scanne à nouveau le QR code."}),
    el("button",{class:"btn primary",text:"Réessayer",onclick:function(){location.reload();}})
  ]));
});
window.addEventListener("online",function(){ if(pendingCount()) sync(true); });
document.addEventListener("visibilitychange",function(){ if(!document.hidden && pendingCount()) sync(true); });
})();
